# ============================================================================
# 文件: alert.rules.yml
# 作用: 定义 Prometheus 的告警规则
#
# Prometheus 告警流程:
#   1. Prometheus 定期执行 alert.rules.yml 中的 expr（表达式）
#   2. 如果表达式结果为 true 且持续 for 指定时间，触发告警
#   3. 告警推送给 Alertmanager
#   4. Alertmanager 根据路由规则发送邮件/钉钉/企业微信等
#
# 语法:
#   groups: 告警组集合
#     - name: 组名（用于分组显示）
#       interval: 评估间隔（多久检查一次规则）
#       rules:
#         - alert: 告警名称
#           expr: PromQL 表达式（结果为 true/false）
#           for: 持续多久才触发（防止抖动）
#           labels: 标签（用于路由和分组）
#           annotations: 注释（告警消息内容）
#
# 用法:
#   修改后无需重启 Prometheus，Prometheus 会自动热加载
#   验证规则语法: promtool check rules alert.rules.yml
# ============================================================================

groups:
  # ---------- 组 1: K8s Pod 告警 ----------
  - name: k8s_alerts
    # 每 30 秒评估一次这个组的规则
    interval: 30s
    rules:
      # 告警: Pod 重启警告
      # 触发条件: 最近 5 分钟内 Pod 容器重启率 > 0
      # 为什么用 rate: rate 计算的是"每秒变化率"，比直接计数更敏感
      - alert: PodRestartWarning
        expr: rate(kube_pod_container_status_restarts_total[5m]) > 0
        # 持续 1 分钟才触发（防止刚启动时的正常重启误报）
        for: 1m
        # labels: 给告警打标签，Alertmanager 用这些标签做路由和分组
        labels:
          severity: warning          # 严重程度: warning（警告）
        # annotations: 告警消息的标题和正文，支持模板变量
        annotations:
          summary: "检测到 Pod 发生重启"
          # {{ $labels.pod }}: 被触发的 Pod 名称
          # {{ $labels.namespace }}: Pod 所在的命名空间
          description: "Pod {{ $labels.pod }} 在 {{ $labels.namespace }} 命名空间中发生重启"

  # ---------- 组 2: 自监控告警（监控监控系统本身） ----------
  - name: self_monitoring
    interval: 30s
    rules:
      # 告警: Prometheus 自身宕机
      # up{job="prometheus"}: Prometheus 内置指标，1=健康，0=宕机
      - alert: PrometheusDown
        expr: up{job="prometheus"} == 0
        for: 1m
        labels:
          severity: critical         # critical（严重）: 需要立即处理
        annotations:
          summary: "Prometheus 自身宕机"
          description: "Prometheus 实例 {{ $labels.instance }} 已不可达"

      # 告警: Alertmanager 宕机
      # 如果 Alertmanager 挂了，即使 Prometheus 触发了告警也发不出去
      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager 宕机，告警将无法发出"
          description: "Alertmanager 实例 {{ $labels.instance }} 已不可达"

  # ---------- 组 3: 节点资源告警 ----------
  - name: node_resource_alerts
    interval: 30s
    rules:
      # 告警: 磁盘压力
      # node_filesystem_avail_bytes: 可用字节数
      # node_filesystem_size_bytes: 总字节数
      # 比值 < 0.1 表示可用空间不足 10%
      - alert: NodeDiskPressure
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.1
        for: 2m                        # 持续 2 分钟才触发（防止临时波动）
        labels:
          severity: warning
        annotations:
          summary: "节点磁盘剩余不足 10%"
          # {{ $labels.device }}: 具体的磁盘设备名（如 /dev/sda1）
          description: "节点 {{ $labels.instance }} 磁盘 {{ $labels.device }} 剩余空间不足 10%"

      # 告警: 内存使用率过高
      # node_memory_MemAvailable_bytes: 可用内存（比 free 更准确，包含缓存）
      # node_memory_MemTotal_bytes: 总内存
      # 1 - 可用/总 = 使用率，> 0.85 表示超过 85%
      - alert: NodeMemoryHigh
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "节点内存使用率超过 85%"
          description: "节点 {{ $labels.instance }} 内存使用率超过 85%"

      # 告警: Node Exporter 不可达
      # 如果 Node Exporter 挂了，我们就看不到节点指标了
      - alert: NodeNotReady
        expr: up{job="node-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Node Exporter 节点不可达，可能节点已宕机"
          description: "Node Exporter {{ $labels.instance }} 已不可达"
